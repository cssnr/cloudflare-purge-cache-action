name: "Test"

# actions-up-ignore-file

on:
  workflow_dispatch:
  schedule:
    - cron: "18 18 * * 1,3,5"
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/test.yaml"
      - "dist/**"
      - "src/**"
      - "package*.json"
      - "requirements*.txt"
      - "action.yaml"
      - "Dockerfile"
      - "pyproject.toml"

env:
  ZONES: ${{ vars.ZONES || 'cssnr.com,example.com' }}
  DRY_RUN: "true"
  FILES: ""
  PREFIX: ""
  TAGS: ""
  HOSTS: ""
  PREFIXES: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Debug event.json"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: |
          cat "${GITHUB_EVENT_PATH}"

      - name: "Debug CTX github"
        if: ${{ !github.event.act }}
        continue-on-error: true
        env:
          GITHUB_CTX: ${{ toJSON(github) }}
        run: echo "$GITHUB_CTX"

      - name: "Debug Environment"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: |
          env

      - name: "Edit YAML"
        if: ${{ !github.event.act }}
        uses: Liam-Johnston/yaml-helper@V1
        with:
          file-location: "action.yaml"
          create-if-does-not-exist: false
          content: |
            runs:
              image: Dockerfile

      - name: "Test Local Action"
        id: test
        uses: ./
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          domains: ${{ env.ZONES }} # DO NOT USE 'domains' use 'zones' instead...
          dry_run: ${{ env.DRY_RUN }}
          files: ${{ env.FILES }}
          prefix: ${{ env.PREFIX }}
          tags: ${{ env.TAGS }}
          hosts: ${{ env.HOSTS }}
          prefixes: ${{ env.PREFIXES }}

      - name: "Validate Outputs"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.test.outputs) }}
          data: |
            success: cssnr.com
            failed: example.com

      - name: "Schedule Failure Notification"
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          description: ${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}
