name: "Test"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Edit YAML"
        uses: Liam-Johnston/yaml-helper@V1
        if: ${{ !github.event.act }}
        with:
          file-location: "action.yml"
          content: |
            runs:
              image: src/Dockerfile

      - name: "Test Local Action"
        id: test
        uses: ./
        with:
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          domains: |
            cssnr.com

      #- name: "Validate Outputs"
      #  run: |
      #    echo "domains: '${{ steps.test.outputs.domains }}'"
      #    if [ -z '${{ steps.test.outputs.domains }}' ];then
      #      echo "No Output: domains"
      #      exit 1
      #    fi

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Flake8"
        run: |
          python -m pip install flake8
          flake8 src
