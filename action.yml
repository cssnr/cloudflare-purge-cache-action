name: "Cloudflare Purge Zone Cache"
description: "Clear or Purge the cache of a zone or multiple domains on Cloudflare."
author: "Shane"
branding:
  icon: "cloud"
  color: "orange"

inputs:
  token:
    description: "Cloudflare API Token"
    required: true
  zones:
    description: "Zones to Purge"
    required: false
    default: ""
  files:
    description: "Files to Purge"
    required: false
    default: ""
  prefix:
    description: "File Prefix"
    required: false
    default: ""
  fail:
    description: "Fail Mode"
    required: false
    default: "all"
  summary:
    description: "Add Summary to Job"
    required: false
    default: "true"
  dry_run:
    description: "Run Without Purging Cache"
    required: false
    default: "false"
  zone:
    description: "DO NOT USE! Backwards Compatibility Only"
    required: false
  domains:
    description: "DO NOT USE! Backwards Compatibility Only"
    required: false

outputs:
  success:
    description: "Successful Zones"
  failed:
    description: "Failed Zones"

runs:
  using: "docker"
  image: "docker://ghcr.io/cssnr/cloudflare-purge-cache-action:v2.0.1"
