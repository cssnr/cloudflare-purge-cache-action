name: "Cloudflare Purge Zone Cache"
description: "Clear or Purge the cache of a zone or multiple domains on Cloudflare."
author: "Shane"
branding:
  icon: "cloud"
  color: "orange"

inputs:
  token:
    description: "Cloudflare API Token"
    required: true
  domains:
    description: "Domains to Purge"
    required: false
    default: ""
  summary:
    description: "Add Summary to Job"
    required: false
    default: "true"
  dry_run:
    description: "Run Without Purging Cache"
    required: false
    default: "false"
  zone:
    description: "For Backwards Compatibility ONLY"
    required: false

runs:
  using: "docker"
  image: "docker://ghcr.io/cssnr/cloudflare-purge-cache-action:v1"
